name: Build

on: [push, pull_request]

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Basic Test
        run: |
          source lib/utils.bash
          url=$(release_url_squeak 6.0-22156)
          echo "$url"
          test -n "$url"

      - name: Install asdf-vm
        uses: asdf-vm/actions/setup@v4

      - name: Install asdf plugin
        run: |
          plugins_dir="${ASDF_DATA_DIR:-$HOME/.asdf}/plugins"
          mkdir -p "$plugins_dir"
          ln -s "$(pwd)" "$plugins_dir/awfy"
          asdf install awfy latest:graaljs
          asdf install awfy latest:pharo
          asdf install awfy latest:squeak
          asdf install awfy latest:oracle-graalvm-ea
